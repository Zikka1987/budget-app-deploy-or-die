name: Deploy SaldoHelt Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy backend to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "${{ secrets.SSH_PORT }}" \
            -o IdentitiesOnly=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" '
              set -e

              cd /home/andreas/apps/budget-app-deploy-or-die

              git pull --ff-only origin main

              docker compose up -d --build

              docker compose ps

              echo "Waiting for local backend health check..."

              for i in $(seq 1 30); do
                if curl -fsS http://127.0.0.1:8000/health; then
                  echo "Local backend health check passed."
                  exit 0
                fi

                echo "Backend not ready yet. Attempt $i/30..."
                sleep 2
              done

              echo "Backend did not become healthy in time."
              docker compose logs --tail=100 backend
              exit 1
            '

      - name: Verify public API
        run: |
          echo "Waiting for public API health check..."

          for i in $(seq 1 30); do
            if curl -fsS https://api.saldohelt.dk/health; then
              echo "Public API health check passed."
              exit 0
            fi

            echo "Public API not ready yet. Attempt $i/30..."
            sleep 2
          done

          echo "Public API did not become healthy in time."
          exit 1
